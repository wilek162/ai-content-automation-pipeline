name: Pipeline automation
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        default: generate
        options: [setup, generate, resume, deliver, reconcile, bind-issue, budget-init]
      config:
        type: string
        default: examples/technical-guide/config.json
      run_id:
        type: string
      isolated:
        type: boolean
        default: false
      acknowledge_paid_retry:
        type: boolean
        default: false
      month:
        type: string
      baseline_usd:
        type: string
      post_id:
        type: string
      issue_number:
        type: string
permissions:
  contents: read
concurrency:
  group: pipeline-state-mutations
  cancel-in-progress: false
jobs:
  operate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - id: resolve
        run: python -m automation_pipeline.integrations.actions resolve
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Generate or review
        if: github.event.inputs.operation != 'deliver' && github.event.inputs.operation != 'reconcile'
        env:
          PIPELINE_SOURCE_COMMIT: ${{ steps.resolve.outputs.source_sha }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m automation_pipeline.integrations.actions
      - name: Deliver or reconcile a WordPress draft
        if: github.event.inputs.operation == 'deliver' || github.event.inputs.operation == 'reconcile'
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python -m automation_pipeline.integrations.actions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: review-artifacts-${{ github.run_id }}
          path: .runtime/runs/
          include-hidden-files: true
          if-no-files-found: ignore
