[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-automation-pipeline"
version = "0.1.0"
description = "Resumable AI content workflows with evidence checks and human-approved draft delivery"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["jsonschema>=4.23,<5", "markdown-it-py>=3,<5", "requests>=2.32,<3"]

[project.optional-dependencies]
gemini = ["google-genai>=1.0,<2"]
anthropic = ["anthropic>=0.40,<1"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.9,<1", "pyyaml>=6,<7", "setuptools>=77", "wheel>=0.45"]
all = ["google-genai>=1.0,<2", "anthropic>=0.40,<1"]

[project.scripts]
content-pipeline = "automation_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
automation_pipeline = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
